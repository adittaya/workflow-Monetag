name: Android Probe (real x86_64 emulator + KVM)

on:
  workflow_dispatch:

jobs:
  probe:
    # ubuntu-latest exposes /dev/kvm but the runner user is NOT in the kvm
    # group — `sudo chmod 666 /dev/kvm` opens it up (no re-login needed) and
    # disable-linux-hw-accel: false + -accel on force hardware accel. macOS
    # hosted runners have no HVF at all (HV_UNSUPPORTED) — that path is dead.
    # API 35 (Android 15) google_apis x86_64 image ships real Chrome
    # (com.android.chrome), so no external browser install is needed.
    # NOTE: this action executes `script:` line-by-line via `/usr/bin/sh -c`,
    # so no heredocs / multi-line shell blocks — all logic lives in the
    # committed python files under probe/.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MONETAG_SMARTLINK_URL: ${{ secrets.MONETAG_SMARTLINK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare KVM + audio libs
        run: |
          sudo apt-get update && sudo apt-get install -y libpulse0
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run headless x86_64 Android emulator + collect evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -accel on -no-window
          script: |
            set -e
            mkdir -p evidence

            echo "=== KVM / ACCEL ==="
            ls -l /dev/kvm || true
            $ANDROID_HOME/emulator/emulator -accel-check || true

            echo "=== DEVICE / BUILD FINGERPRINT ==="
            adb shell getprop ro.build.fingerprint
            adb shell getprop ro.product.model
            adb shell getprop ro.product.brand
            adb shell getprop ro.product.device
            adb shell getprop ro.hardware
            adb shell getprop ro.product.cpu.abi
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk
            adb shell getprop ro.build.flavor
            adb shell getprop ro.build.type
            adb shell getprop ro.debuggable
            adb shell getprop ro.secure
            adb shell getprop ro.bootimage.build.fingerprint

            echo "=== BROWSERS PRESENT ==="
            adb shell pm list packages | grep -iE 'opera|chrome|webview' || echo "NONE (besides webview)"

            echo "=== FORCE-PROVISION (skip setup wizard) ==="
            adb shell settings put global device_provisioned 1 || true
            adb shell settings put secure user_setup_complete 1 || true

            echo "=== DISMISS CHROME FIRST-RUN (FRE) ==="
            python3 probe/dismiss_fre.py || true

            echo "=== UA / CLIENT-HINT CAPTURE (real Chrome headers) ==="
            python3 probe/capture_ua.py

            echo "=== SMARTLINK OPEN ==="
            python3 probe/open_smartlink.py

            echo "=== FULL PROBE EVIDENCE ==="
            adb shell getprop > evidence/getprop_full.txt
            adb shell ls /sdcard > evidence/sdcard.txt || true

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-probe-evidence
          path: evidence/
          if-no-files-found: warn
